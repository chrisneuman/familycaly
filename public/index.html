<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Family Calendar</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" class="loading">
  <div class="top">
    <div class="when"><div class="dname" id="dname"></div><div class="dsub"><span id="dsub"></span> · <b id="clock"></b></div></div>
    <button class="wxpill" id="wxnow" data-act="weather" aria-label="Weather details" hidden></button>
    <div class="lunches" id="lunches"></div>
    <div class="people" id="people"></div>
  </div>
  <div class="strip" id="strip"></div>
  <div class="calwrap">
    <div class="calhead">
      <div class="month" id="month"></div>
      <span class="status" id="status" hidden></span>
      <button class="tbtn" data-act="today">Jump to today</button>
      <button class="tbtn moon" id="moonbtn" data-act="night" aria-label="Night mode" hidden></button>
    </div>
    <div class="dow" id="dow"></div>
    <div class="weeks" id="weeks"></div>
  </div>
  <div class="night" id="night" data-act="wake" aria-hidden="true"><b id="nclock"></b></div>
  <div class="sheet-wrap" id="sheet" data-act="close" hidden><div class="sheet" role="dialog" aria-modal="true"></div></div>
</div>
<script src="app.js"></script>
</body>
</html>
