<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Family Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" class="loading">
  <div class="top">
    <div class="when"><div class="dname" id="dname"></div><div class="dsub"><span id="dsub"></span> · <b id="clock"></b></div></div>
    <div class="wxpill" id="wxnow" hidden></div>
    <button class="lunch" id="lunchbtn" data-act="lunch" hidden></button>
    <div class="people" id="people"></div>
  </div>
  <div class="strip" id="strip"></div>
  <div class="calwrap">
    <div class="calhead">
      <div class="month" id="month"></div>
      <span class="status" id="status" hidden></span>
      <button class="tbtn" data-act="today">Jump to today</button>
    </div>
    <div class="dow" id="dow"></div>
    <div class="weeks" id="weeks"></div>
  </div>
  <div class="sheet-wrap" id="sheet" data-act="close" hidden><div class="sheet" role="dialog" aria-modal="true"></div></div>
</div>
<script src="app.js"></script>
</body>
</html>
